name: Keep Render service awake

on:
  schedule:
    - cron: "3-59/8 0-14,18-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-cadlens-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping CADLens health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://naverogq.onrender.com/api/health > /dev/null
