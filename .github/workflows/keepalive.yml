name: Keep Render service awake

on:
  schedule:
    # 매 10분마다 실행하되, 한국시간(KST) 00:00~03:00은 "점검시간"으로 비워
    # 서비스가 자연스럽게 슬립하도록 둔다 (Render 무료 750시간/월 절약용).
    # KST 00:00~02:59 = UTC 15:00~17:59 → 그 시간대(UTC 15,16,17시)만 제외.
    - cron: "*/10 0-14,18-23 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        run: |
          set -e
          url="https://naverogq.onrender.com/api/health"
          # 콜드스타트로 첫 응답이 느릴 수 있어 넉넉히 타임아웃/재시도 부여
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after 3 attempts"
          exit 1
