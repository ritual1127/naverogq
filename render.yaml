services:
  - name: cad-checker
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      # Gemini 할당량이 끊겼을 때 투상도 30점 채점을 이어받는 경로
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      # 접속 수와 검사 횟수가 쌓이는 D1. 이 셋이 다 있어야 D1 을 쓰고,
      # 하나라도 없으면 서버 안 sqlite 로 세다가 재시작 때 0 이 된다.
      # CLOUDFLARE_API_TOKEN 에 D1 쓰기 권한이 있어야 한다.
      - key: CADLENS_D1_STATS
        value: ac0c4017-3c86-4d94-b84a-e76e98af564a
      # 앞이 모두 막혔을 때 쓰는 예비 경로
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
