services:
  - name: cad-checker
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 투상도 30점 채점 1순위(Workers AI · Llama 4 Scout)
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      # 접속 수와 검사 횟수가 쌓이는 D1. 이 셋이 다 있어야 D1 을 쓰고,
      # 하나라도 없으면 서버 안 sqlite 로 세다가 재시작 때 0 이 된다.
      # CLOUDFLARE_API_TOKEN 에 D1 쓰기 권한이 있어야 한다.
      - key: CADLENS_D1_STATS
        value: ac0c4017-3c86-4d94-b84a-e76e98af564a
      # Cloudflare 가 막히거나 하루 무료량이 마르면 채점을 이어받는 경로(Vercel AI Gateway, 같은 모델).
      # Vercel 은 결제 수단을 등록해야 무료 크레딧이 열린다 — 등록 전에는 값을 비워 둔다
      - key: AI_GATEWAY_API_KEY
        sync: false
      # 관리자 화면(/admin) 비밀번호. 값은 Render 대시보드에서만 넣는다 —
      # 저장소가 공개라 여기 적으면 그 순간 누구나 아는 값이 된다.
      # 값이 없으면 /admin 은 503 을 내고 아무도 못 들어간다.
      - key: CADLENS_ADMIN_PW
        sync: false
      # 대회 사무국이 준 OGQ 마켓 API 키. 결과 화면 캐릭터 스티커를 받는다. 없으면 스티커만 빠진다
      - key: OGQ_API_KEY
        sync: false
      # 텔레그램 알림 — 문의 · 오류 신고가 오거나 재검사한 사람이 생기면 한 줄 보낸다.
      # 토큰은 BotFather 가 준 값, 방 번호는 봇에게 말을 건 뒤 getUpdates 의 chat.id.
      # 둘 중 하나라도 없으면 알림만 빠진다. 값은 Render 대시보드에서만 넣는다.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
