<title>CADLens</title>
<style>
:root{--bg:#080b0f;--panel:#121922;--panel2:#17202b;--line:#273341;--line2:#354354;--text:#eef5f8;--muted:#94a3ad;--soft:#64727e;--cyan:#38d7ee;--mint:#48e1b9;--red:#ff4d63;--amber:#ffb020;--green:#8ee56a;--violet:#9f7aea;--shadow:0 24px 70px rgba(0,0,0,.36);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0}html,body{min-height:100%;background:var(--bg);color:var(--text)}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.55}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}.hide{display:none!important}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{min-height:100vh;background:radial-gradient(circle at 18% -10%,rgba(56,215,238,.18),transparent 36%),linear-gradient(180deg,#0b1016 0%,#070a0e 62%,#080b0f 100%)}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(8,11,15,.72);backdrop-filter:blur(18px);position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:13px;min-width:0}.logo{width:42px;height:42px;border-radius:11px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.1)}.brand b{font-size:18px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:1px}.top-actions{display:flex;gap:10px;align-items:center}.pill{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.035);font-size:12px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}.lang{height:34px;border:1px solid var(--line);border-radius:999px;background:#101821;padding:0 12px;font-size:12px}
.home{width:min(1240px,100%);margin:0 auto;padding:28px 28px 52px}.hero{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(380px,.98fr);gap:22px;align-items:stretch}.headline{padding:34px 0 18px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:14px}h1{font-size:clamp(38px,5vw,68px);line-height:.98;font-weight:850;max-width:760px}.copy{max-width:650px;margin-top:20px;color:#b9c5cd;font-size:17px}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.metric{min-width:118px;padding:13px 15px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:7px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted)}
.upload-card{border:1px solid rgba(255,255,255,.1);border-radius:8px;background:linear-gradient(180deg,rgba(23,32,43,.9),rgba(14,20,27,.96));box-shadow:var(--shadow);overflow:hidden}.upload-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}.upload-head b{font-size:14px}.upload-head span{font-size:12px;color:var(--muted)}.drop{min-height:305px;margin:18px;border:1px dashed rgba(56,215,238,.55);border-radius:8px;display:grid;place-content:center;text-align:center;background:linear-gradient(135deg,rgba(56,215,238,.08),rgba(47,128,255,.04));transition:.18s}.drop:hover,.drop.over{border-color:var(--cyan);background:rgba(56,215,238,.1)}.drop img{width:86px;height:86px;border-radius:22px;margin:0 auto 18px;object-fit:cover}.drop .t{font-size:21px;font-weight:820}.drop .s{margin-top:7px;color:var(--muted);font-size:13px}.format-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px}.chip{border:1px solid var(--line);background:#101821;color:#b7c4cc;border-radius:999px;padding:7px 10px;font-size:12px}
.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-top:24px}.side,.mainpanel,.card{border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(18,25,34,.88)}.side{padding:16px;align-self:start}.section-title{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:12px}.samples{display:flex;flex-direction:column;gap:9px}.sample{padding:12px;border:1px solid var(--line);border-radius:7px;text-align:left;background:#101821}.sample:hover{border-color:var(--cyan)}.sample b{display:block;font-size:13px;word-break:break-all}.sample span{font-size:11px;color:var(--soft)}.picker{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.picker summary{list-style:none;display:flex;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:800}.picker summary::-webkit-details-marker{display:none}.group{margin-top:14px}.group h4{font-size:11px;color:var(--cyan);margin-bottom:7px}.group label{display:flex;gap:8px;padding:5px 0;font-size:12px;color:#c8d1d7}.pbtns{display:flex;gap:8px;margin-top:12px}.smallbtn{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#101821;font-size:11px;color:#cbd6dc}
.mainpanel{padding:18px}.rubgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.rub{padding:14px;border:1px solid var(--line);border-radius:7px;background:#101821}.rub span{font-size:11px;color:var(--muted)}.rub b{display:block;margin-top:5px;font-size:20px;color:var(--cyan)}.dq{margin-top:14px;padding:14px;border:1px solid rgba(255,77,99,.35);border-radius:7px;background:rgba(255,77,99,.08)}.dq b{color:#ff9aa7}.dq div{margin-top:8px;color:#ffc7ce;font-size:13px}.note{margin-top:14px;color:var(--soft);font-size:12px}.warn{padding:12px 14px;border:1px solid rgba(255,176,32,.38);background:rgba(255,176,32,.08);border-radius:7px;color:#ffd99a;font-size:13px}.loading{padding:70px 20px;text-align:center}.spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(56,215,238,.18);border-top-color:var(--cyan);margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.err{padding:14px;border:1px solid rgba(255,77,99,.55);background:rgba(255,77,99,.09);border-radius:7px;color:#ffc4cb;white-space:pre-wrap}
.results{min-height:100vh}.rbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.08);background:#0b1016;position:sticky;top:0;z-index:20}.filebox{display:flex;align-items:center;gap:12px;min-width:0}.filebox h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filebox p{font-size:12px;color:var(--muted)}.back{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:7px;background:#111923;color:#c9d4db}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(370px,.9fr);gap:16px;padding:16px 24px 24px}.left{position:sticky;top:82px;display:flex;flex-direction:column;gap:12px;min-width:0}.right{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 88px);overflow:auto;padding-right:4px}
.viewer{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0c1218}.tools{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#111923}.viewer-title{font-size:12px;font-weight:800;color:var(--muted)}.zoom{font:700 12px var(--mono);color:var(--cyan)}.stage{height:calc(100vh - 146px);min-height:560px;overflow:hidden;position:relative;background:#0a0f14}.pan{position:absolute;left:0;top:0;transform-origin:0 0}.pan svg{display:block;max-width:none;height:auto}
.score{padding:17px}.score.pass{border-color:rgba(72,225,185,.28)}.score.fail{border-color:rgba(255,77,99,.55);background:rgba(255,77,99,.08)}.score .big{font:850 42px var(--mono);color:var(--mint);line-height:1}.score.fail .big{font-family:inherit;font-size:29px;color:var(--red)}.score p{margin-top:6px;color:var(--muted);font-size:13px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.count{padding:10px;border-radius:6px;background:#101821}.count span{font-size:11px;color:var(--muted)}.count b{display:block;font-size:20px}.item,.finding,.info{border:1px solid var(--line);border-radius:7px;background:#101821}.item{padding:11px}.itemtop{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}.bar{height:5px;background:#26313f;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--cyan)}
.finding{overflow:hidden}.finding button{width:100%;padding:12px;text-align:left;display:flex;justify-content:space-between;gap:10px}.ftitle{font-size:13px;font-weight:850}.fmeta{font-size:11px;color:var(--muted);margin-top:3px}.fbody{border-top:1px solid var(--line);padding:12px;color:#cbd7de;font-size:12.5px}.fix{margin-top:10px;padding:9px;border-left:3px solid var(--green);background:rgba(142,229,106,.08);color:#d8ffc9}.marker-summary{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.marker-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid rgba(255,77,99,.35);border-radius:999px;background:rgba(255,77,99,.1);font:11px var(--mono);color:#ffc5cc}.marker-chip b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff}.filters{display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-bottom:4px;z-index:2}.filters button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:#101821;font-size:12px;color:#cbd6dc}.filters button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(56,215,238,.08)}.info{padding:12px}.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info span{display:block;font-size:11px;color:var(--muted)}.info b{display:block;font:12px var(--mono);word-break:break-all;margin-top:2px}.disc{font-size:11px;color:var(--soft);padding:12px;border-radius:7px;background:rgba(255,255,255,.035)}.mstage{height:44vh;min-height:280px}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img class="logo" src="/static/logo.png" alt=""><div><b>CADLens</b><span data-i18n="brandSub">도면 자동 검사</span></div></div>
    <div class="top-actions"><select class="lang" id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select><div class="pill"><i class="dot"></i><span id="support" data-i18n="ready">준비 중</span></div></div>
  </header>
  <main id="home" class="home">
    <section class="hero">
      <div class="headline">
        <div class="eyebrow">NAVER OGQ AI Competition</div>
        <h1 data-i18n="heroTitle">도면을 올리면, 채점 근거까지 바로 보입니다.</h1>
        <p class="copy" data-i18n="heroCopy">DWG와 DXF 도면을 읽고 치수, 투상도, 공차, 표면거칠기, 주서 항목을 자동 점검합니다. 문제 위치는 미리보기 위에 번호로 표시됩니다.</p>
        <div class="metrics"><div class="metric"><strong id="mchecks">-</strong><span data-i18n="checks">검사 항목</span></div><div class="metric"><strong>2D</strong><span>DWG · DXF</span></div><div class="metric"><strong>AI</strong><span data-i18n="aiReview">배치 검토</span></div></div>
      </div>
      <div class="upload-card">
        <div class="upload-head"><b data-i18n="newCheck">새 도면 검사</b><span data-i18n="chooseOrDrop">파일 선택 또는 드래그</span></div>
        <label id="drop" class="drop"><img src="/static/logo.png" alt=""><div class="t" data-i18n="dropTitle">도면 파일을 놓으세요</div><div class="s"><span id="exts">.dwg · .dxf</span> <span data-i18n="orZip">또는 zip 패키지</span></div><input id="file" type="file" style="display:none"></label>
        <div class="format-row" id="formatrow"></div>
      </div>
    </section>
    <div id="status" style="margin-top:16px"></div>
    <section class="workspace" id="work">
      <aside class="side">
        <div id="samples" class="hide"><div class="section-title" data-i18n="samples">예제 도면</div><div class="samples" id="sgrid"></div></div>
        <details class="picker" id="picker" open><summary><span data-i18n="checks">검사 항목</span><span class="mono" id="pcount"></span></summary><div id="pbody"></div></details>
      </aside>
      <section class="mainpanel"><div class="section-title" data-i18n="rubric">채점 기준</div><div class="rubgrid" id="rubric"></div><div class="dq" id="dqsec"><b data-i18n="dq">실격 조건</b><div id="dqlist"></div></div><p class="note" id="foot"></p></section>
    </section>
  </main>
  <main id="res" class="results hide">
    <div class="rbar"><div class="filebox"><img class="logo" src="/static/logo.png" alt=""><div style="min-width:0"><h2 id="rfile"></h2><p id="rmeta"></p></div></div><button class="back" id="back" data-i18n="back">다른 도면 검사</button></div>
    <div class="grid">
      <section class="left">
        <div class="viewer hide" id="viewer"><div class="tools"><div class="viewer-title" data-i18n="preview">도면 미리보기</div><div class="zoom" id="zoomv" data-i18n="fitFixed">자동 맞춤</div></div><div class="stage" id="stage"><div class="pan" id="pan"></div></div></div>
        <div class="warn hide" id="novw"></div>
        <div class="viewer hide" id="m3d"><div class="tools"><div><button class="smallbtn" id="mreset" data-i18n="reset">초기화</button> <button class="smallbtn" id="mwire" data-i18n="wire">와이어</button></div><div class="zoom">3D</div></div><div class="stage mstage" id="mstage"></div></div>
        <div class="info hide" id="info"><div class="section-title" data-i18n="fileInfo">파일 정보</div><div class="infogrid" id="igrid"></div></div>
      </section>
      <section class="right"><div id="rwarn"></div><div id="score"></div><div><div class="section-title" data-i18n="scoreItems">채점 항목</div><div id="items" style="display:flex;flex-direction:column;gap:8px"></div><div id="verdict"></div></div><div><div class="section-title" data-i18n="findings">지적사항</div><div class="filters" id="fbar"></div><div id="finds" style="display:flex;flex-direction:column;gap:8px"></div></div><div class="disc" id="disc"></div></section>
    </div>
  </main>
</div>
<script src="/static/vendor/three.min.js"></script>

ookAt(0,0,0);renderer.render(scene,camera)})()}).catch(()=>box.classList.add('hide'))}
function drawPicker(){if(!CHECKS.length)return;const groups=[];CHECKS.forEach(c=>{let g=groups.find(x=>x.key===c.group);if(!g)groups.push(g={key:c.group,label:groupLabel(c),items:[]});g.items.push(c)});$('#pbody').innerHTML=groups.map(g=>`<div class="group"><h4>${esc(g.label)}</h4>${g.items.map(c=>`<label><input type="checkbox" data-id="${esc(c.id)}" ${enabled.has(c.id)?'checked':''}><span>${esc(translatedCheck(c))}</span></label>`).join('')}</div>`).join('')+`<div class="pbtns"><button class="smallbtn" data-p="all">${t('allOn')}</button><button class="smallbtn" data-p="none">${t('allOff')}</button><button class="smallbtn" data-p="def">${t('basic')}</button></div>`;$('#pbody').querySelectorAll('input[data-id]').forEach(el=>el.onchange=()=>{el.checked?enabled.add(el.dataset.id):enabled.delete(el.dataset.id);persist()});$('#pbody').querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{if(b.dataset.p==='all')enabled=new Set(CHECKS.map(c=>c.id));else if(b.dataset.p==='none')enabled=new Set();else enabled=new Set(CHECKS.filter(c=>c.default).map(c=>c.id));drawPicker();persist()});persist()}
const _renderResult=render;render=d=>{const findings=(d.findings||[]).map(f=>({...f,...findingText(f),item:(CHECK_LABELS[lang]||{})[f.item]||f.item}));const scorecard={...(d.scorecard||{})};scorecard.items=(scorecard.items||[]).map(it=>({...it,label:(CHECK_LABELS[lang]||{})[it.code]||it.label}));if(lang!=='ko'){scorecard.disqualifiers=findings.filter(f=>f.severity==='fail').map(f=>f.title);if(scorecard.ai_verdict)scorecard.ai_verdict={en:'AI review is available for human confirmation.',ja:'AI レビューは人による確認用に表示されています。',zh:'AI 检查结果仅供人工确认。'}[lang]}d={...d,findings,scorecard,model_error:lang==='ko'?d.model_error:''};_renderResult(d)};
findingText=function(f){const saved=(FINDING_I18N[lang]||{})[f.code];if(saved){const raw=[f.title,f.detail,f.fix].join(' ');const nums=[...raw.matchAll(/[-+]?\d+(?:\.\d+)?/g)].map(x=>x[0]);const where=Object.values(f.where||{}).filter(Boolean).join(' · ')||'';const vals={n:nums[0]||'',d:nums[0]||'',v:nums.slice(0,4).join(' / '),where};const fill=s=>s.replace(/\{(\w+)\}/g,(_,k)=>vals[k]??'');return{title:fill(saved[0]),detail:fill(saved[1]),fix:fill(saved[2])}}if(lang==='ko')return{title:f.title,detail:f.detail,fix:f.fix};const label=(CHECK_LABELS[lang]||{})[f.code]||f.code;const generic={en:['The drawing does not meet this check requirement.','Review the marked drawing content and correct it before submission.'],ja:['この図面は検査条件を満たしていません。','指摘された図面内容を確認し、提出前に修正してください。'],zh:['该图纸未满足此检查要求。','请检查标记的图纸内容，并在提交前修正。']}[lang];return{title:label,detail:generic[0],fix:generic[1]}};
applyLang();
