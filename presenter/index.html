<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CADLens 발표 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0d1117; --panel: #151b24; --line: #263040; --ink: #eef2f6; --dim: #8a97a6;
    --faint: #5b6675; --accent: #4cb8ff; --mine: #ffe08a; --warn: #ffb347; --bad: #ff6b6b; --ok: #4ade80;
    --fs: 1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; word-break: keep-all;
  }
  button, select { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 위 띠 */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs [role="tab"] { padding: 6px 16px; font-weight: 600; }
  .tabs [aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #04121d; }
  .net { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
  .net.on { color: var(--ok); border-color: #1f5135; }
  .net.off { color: var(--warn); border-color: #5a4220; }
  .spacer { flex: 1; }
  .bar label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .bar input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  main { position: relative; min-height: 0; }
  [role="tabpanel"] { position: absolute; inset: 0; }
  [role="tabpanel"][hidden] { display: none; }

  /* 슬라이드 — 1920×1080 을 화면에 맞춰 줄인다 */
  #slides { background: #000; }
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center; background: var(--bg); overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding: 120px 150px 140px;
  }
  .kicker { font-size: 44px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 40px; }
  .headline { font-size: 150px; font-weight: 800; line-height: 1.12; letter-spacing: -3px; }
  .sub { margin-top: 56px; font-size: 52px; color: var(--dim); font-weight: 500; }
  .value { font-size: 200px; font-weight: 800; letter-spacing: -4px; line-height: 1; white-space: nowrap; }
  .caption { margin-top: 60px; font-size: 56px; font-weight: 600; line-height: 1.3; }
  .note { margin-top: 28px; font-size: 44px; color: var(--dim); }
  .arrow { color: var(--accent); font-weight: 700; }
  .steps { display: flex; align-items: flex-end; gap: 24px; }
  .step { flex: 1 1 0; min-width: 0; text-align: center; }
  .step b { display: block; font-size: 190px; font-weight: 800; line-height: 1; letter-spacing: -4px; }
  .step span { display: block; margin-top: 18px; font-size: 42px; color: var(--dim); font-weight: 600; }
  .steps .arrow { font-size: 110px; padding-bottom: 82px; }
  .question { font-size: 118px; font-weight: 800; line-height: 1.18; letter-spacing: -2px; }
  .cover-note { margin-top: 22px; font-size: 40px; color: var(--accent); font-weight: 600; }
  /* 요점 목록이 붙은 숫자 장 — 숫자를 조금 줄여 자리를 만든다 */
  .with-points .value { font-size: 160px; }
  .points { list-style: none; margin-top: 40px; display: grid; gap: 12px; }
  .points li { position: relative; padding-left: 44px; font-size: 40px; font-weight: 600; line-height: 1.3; }
  .points li::before { content: "•"; position: absolute; left: 8px; color: var(--accent); }
  .with-points .caption { margin-top: 36px; font-size: 46px; }
  /* W4 → 지금 표 */
  .stage.kind-compare { padding: 90px 150px 120px; }
  .cmp { width: 100%; border-collapse: collapse; }
  .cmp th { text-align: left; font-size: 32px; color: var(--dim); font-weight: 700; padding: 0 24px 18px; border-bottom: 2px solid var(--line); }
  .cmp td { padding: 20px 24px; border-bottom: 1px solid var(--line); font-size: 40px; vertical-align: baseline; line-height: 1.25; }
  .cmp td:first-child { width: 32%; color: var(--dim); font-size: 34px; }
  .cmp td:nth-child(2) { width: 20%; color: var(--dim); }
  .cmp td:nth-child(3) { font-weight: 750; }
  .cmp-note { margin-top: 22px; font-size: 28px; color: var(--faint); }
  /* 실제 화면 두 장 — 그림을 크게, 설명은 그림 위에 얹는다 */
  .stage.kind-pair { padding: 64px 120px 110px; }
  .kind-pair .kicker { margin-bottom: 26px; }
  .pair { display: flex; gap: 44px; justify-content: center; }
  .pair figure { margin: 0; }
  /* 설명은 그림 바깥 위에 — 그림 안에 얹으면 초록 치수 글자를 가린다 */
  .pair figcaption { margin-bottom: 12px; font-size: 32px; font-weight: 700; }
  .pair figure:last-child figcaption { color: #6ee7a8; }
  .pair img { display: block; height: 620px; width: auto; border-radius: 16px; border: 2px solid var(--line); }
  .kind-pair .caption { margin-top: 26px; font-size: 40px; text-align: center; }
  .kind-pair .note { margin-top: 10px; font-size: 26px; text-align: center; color: var(--faint); }
  .foot {
    position: absolute; left: 150px; right: 150px; bottom: 56px;
    display: flex; justify-content: space-between; font-size: 30px; color: var(--faint);
  }

  /* 대본 */
  #script { display: grid; grid-template-rows: auto 1fr auto; }
  #script[hidden] { display: none; }
  .script-top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
  }
  .where { font-size: 26px; font-weight: 800; }
  .where small { color: var(--dim); font-weight: 600; margin-right: 10px; }
  .turn { margin-left: 12px; font-size: 18px; font-weight: 700; color: var(--dim); }
  .turn .me-too { color: var(--mine); }
  .clock { font-size: 22px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .clock b { color: var(--ink); font-size: 30px; }
  .clock .warn { color: var(--warn); }
  .clock .bad { color: var(--bad); }
  .lines { list-style: none; overflow-y: auto; padding: 22px 28px 40px; }
  .line {
    display: grid; grid-template-columns: 4.4em 1fr; gap: 0 18px; align-items: baseline;
    padding: .38em 0 .38em 14px; border-left: 6px solid transparent;
    font-size: calc(var(--fs) * clamp(24px, 2.6vw, 46px)); line-height: 1.45;
  }
  /* 읽는 사람마다 다른 색(--who). 내 줄은 노랑으로 따로 강조한다 */
  .who {
    font-size: .52em; font-weight: 750; text-align: right; justify-self: end;
    padding: .2em .55em; border-radius: 6px;
    color: var(--who); background: color-mix(in srgb, var(--who) 16%, transparent);
  }
  .say { font-weight: 600; }
  .line.dim { color: #737f8e; }
  .line.dim .who { background: transparent; opacity: .8; }
  .line.mine { border-left-color: var(--mine); }
  .line.mine .say { color: var(--mine); font-weight: 750; }
  .line.mine .who { background: var(--who); color: #0d1117; }
  .legend { display: flex; gap: 10px; font-size: 15px; font-weight: 700; }
  .legend span { color: var(--who); }
  .name { color: var(--who); font-weight: 700; }
  .next {
    padding: 14px 24px; border-top: 1px solid var(--line); color: var(--dim);
    font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .next b { color: var(--ink); }
  .next.mine { color: var(--mine); }
  .next.mine b { color: var(--mine); }

  /* 아래 띠 */
  .nav {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-top: 1px solid var(--line); font-size: 14px; color: var(--dim);
  }
  .dots { display: flex; gap: 6px; }
  .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; }
  .dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
  .count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
  .keys { margin-left: auto; color: var(--faint); }

  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; font-size: 14px; max-width: calc(100vw - 32px); overflow-wrap: anywhere;
  }

  /* 전체화면에서는 띠를 숨긴다 — 슬라이드 탭이면 슬라이드만 남는다 */
  body.full .bar, body.full .nav { display: none; }

  @media (max-width: 720px) {
    .keys { display: none; }
    .line { grid-template-columns: 1fr; }
    .who { justify-self: start; margin-bottom: .2em; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .line { transition: color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="tabs" role="tablist" aria-label="화면">
    <button role="tab" id="tab-slides" aria-controls="slides" aria-selected="true">슬라이드</button>
    <button role="tab" id="tab-script" aria-controls="script" aria-selected="false">대본</button>
  </div>
  <span class="net" id="net" role="status">○ 연결 중…</span>
  <span class="spacer"></span>
  <label>나 <select id="me" aria-label="내 이름"><option value="">고르지 않음</option></select></label>
  <label title="켜면 이 기기에서는 넘기지 않고 다른 기기만 따라갑니다"><input type="checkbox" id="lock"> 따라가기만</label>
  <button id="share" type="button">방 주소 복사</button>
  <button id="full" type="button" title="F">⛶ 전체화면</button>
</header>

<main>
  <section id="slides" role="tabpanel" aria-labelledby="tab-slides">
    <div class="stage" id="stage"></div>
  </section>
  <section id="script" role="tabpanel" aria-labelledby="tab-script" hidden>
    <div class="script-top">
      <div class="where" id="where"></div>
      <div class="clock">전체 <b id="total">0:00</b> / <span id="limit"></span>
        · 이 장 <b id="here">0:00</b> / <span id="aim"></span></div>
      <div class="legend" id="legend" aria-label="읽는 사람 색"></div>
      <span class="spacer"></span>
      <button id="start" type="button">타이머 시작</button>
      <button id="reset" type="button">다시</button>
      <button id="smaller" type="button" aria-label="글자 작게">가−</button>
      <button id="bigger" type="button" aria-label="글자 크게">가+</button>
    </div>
    <ol class="lines" id="lines"></ol>
    <div class="next" id="next"></div>
  </section>
</main>

<footer class="nav">
  <button id="prev" type="button">◀ 이전</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
  <button id="nextBtn" type="button">다음 ▶</button>
  <span class="keys">→ · Space 다음 · ← 이전 · F 전체화면 · T 탭</span>
</footer>
<div class="toast" id="toast" hidden></div>
<noscript>자바스크립트를 켜야 발표 도우미가 뜹니다.</noscript>

<script type="module">
import { initial, step, setTimer, toWire, receive } from "./state.js";
import { TALK, targetSeconds } from "./talk.js";

// 기기 사이 중계 — Supabase 실시간 채널. 이 키는 브라우저에 두라고 만든 공개용 키이고 테이블은 쓰지 않는다.
const SUPABASE_URL = "https://hgmshnoaipajahvmzcqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_dSIb5HLyDunrFEprXL00DA_kCIJml3E";
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = (id) => document.getElementById(id);
const COUNT = TALK.slides.length;
const ME_ID = crypto.getRandomValues(new Uint32Array(2)).join("").slice(0, 12);   // 이 기기(탭) — 동률 판정용

const store = {
  get(k, d) { try { return localStorage.getItem("presenter." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("presenter." + k, v); } catch { /* 저장이 막혀도 화면은 돈다 */ } },
};

// 방 — 주소 뒤 #코드. 코드를 아는 기기끼리만 같이 넘어간다.
function roomCode() {
  const code = location.hash.slice(1).toLowerCase();
  if (/^[a-z0-9]{4,16}$/.test(code)) return code;
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  const made = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => abc[b % abc.length]).join("");
  history.replaceState(null, "", "#" + made);
  return made;
}
const ROOM = roomCode();
addEventListener("hashchange", () => location.reload());

let state = initial(ME_ID);
let enteredAt = Date.now();          // 이 장에 들어온 때 (기기마다)
let channel = null, net = "wait", peers = 0;

// ---------------------------------------------------------------- 그리기
const fmt = (sec) => { const s = Math.max(0, Math.floor(sec)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.append(...withBreaks(text));
  return e;
}
function arrow() {
  const a = document.createElement("span");
  a.className = "arrow";
  a.textContent = "→";
  return a;
}
// "\n" 은 줄바꿈, "→" 는 강조색으로
function withBreaks(text) {
  const out = [];
  String(text).split("\n").forEach((part, i) => {
    if (i) out.push(document.createElement("br"));
    part.split("→").forEach((bit, j) => {
      if (j) out.push(arrow());
      if (bit) out.push(document.createTextNode(bit));
    });
  });
  return out;
}

const VIEWS = {
  cover: (v) => [el("div", "kicker", v.kicker), el("div", "headline", v.headline), el("div", "sub", v.sub),
                 v.note ? el("div", "cover-note", v.note) : ""],
  compare: (v) => {
    const table = el("table", "cmp");
    const head = el("tr");
    v.head.forEach((h) => head.append(el("th", "", h)));
    table.append(head);
    v.rows.forEach((row) => {
      const tr = el("tr");
      row.forEach((cell) => tr.append(el("td", "", cell)));
      table.append(tr);
    });
    return [el("div", "kicker", v.kicker), table, v.note ? el("div", "cmp-note", v.note) : ""];
  },
  big: (v) => {
    const points = v.points ? el("ul", "points") : "";
    (v.points || []).forEach((p) => points.append(el("li", "", p)));
    return [el("div", "kicker", v.kicker), el("div", "value", v.value), points,
            el("div", "caption", v.caption), v.note ? el("div", "note", v.note) : ""];
  },
  pair: (v) => {
    const row = el("div", "pair");
    v.items.forEach((it) => {
      const fig = el("figure");
      const img = document.createElement("img");
      img.src = it.src;
      img.alt = it.label;
      fig.append(el("figcaption", "", it.label), img);
      row.append(fig);
    });
    return [el("div", "kicker", v.kicker), row, el("div", "caption", v.caption),
            v.note ? el("div", "note", v.note) : ""];
  },
  flow: (v) => {
    const row = el("div", "steps");
    v.steps.forEach((s, i) => {
      if (i) row.append(arrow());
      const box = el("div", "step");
      box.append(el("b", "", s.n), el("span", "", s.label));
      row.append(box);
    });
    return [el("div", "kicker", v.kicker), row, el("div", "caption", v.caption)];
  },
  ask: (v) => [el("div", "kicker", v.kicker), el("div", "question", v.question), el("div", "sub", v.sub)],
};

const here = () => Math.max(0, Math.min(COUNT - 1, state.slide));

// 읽는 사람마다 색 — people 순서대로 붙는다. 노랑은 "내 줄" 강조에 남겨 둔다
const PALETTE = ["#7cc4ff", "#6ee7a8", "#ff9ec4", "#c4a7ff"];
const colorOf = (who) => PALETTE[Math.max(0, TALK.people.indexOf(who)) % PALETTE.length];
function nameTag(who, cls = "name") {
  const n = el("span", cls, who);
  n.style.setProperty("--who", colorOf(who));
  return n;
}

function render() {
  const i = here(), s = TALK.slides[i];
  const stage = $("stage");
  stage.className = `stage kind-${s.view.kind}${s.view.points ? " with-points" : ""}`;
  stage.replaceChildren(...VIEWS[s.view.kind](s.view).filter(Boolean));
  const foot = el("div", "foot");
  foot.append(el("span", "", "CADLens · 팀 네이놈"), el("span", "", `${i + 1} / ${COUNT}`));
  stage.append(foot);

  const me = $("me").value;
  const who = [...new Set(s.lines.map((l) => l.who))];
  const turn = el("span", "turn");
  who.forEach((w, j) => turn.append(...(j ? [document.createTextNode(" · ")] : []), nameTag(w)));
  turn.append(document.createTextNode(" 차례"));
  if (who.includes(me)) turn.append(el("span", "me-too", " — 내 차례"));
  $("where").replaceChildren(el("small", "", `${i + 1} / ${COUNT}`), document.createTextNode(s.title), turn);
  $("lines").replaceChildren(...s.lines.map((l) => {
    const li = el("li", "line" + (me && l.who === me ? " mine" : me ? " dim" : ""));
    li.style.setProperty("--who", colorOf(l.who));
    li.append(el("span", "who", l.who), el("span", "say", l.say));
    return li;
  }));
  $("lines").scrollTop = 0;
  // 여럿이 나눠 읽으니, 다음 장이 내 차례면 미리 알려 준다
  const nx = TALK.slides[i + 1];
  const mineNext = Boolean(me && nx && nx.lines.some((l) => l.who === me));
  $("next").className = "next" + (mineNext ? " mine" : "");
  $("next").replaceChildren(...(nx
    ? [document.createTextNode(mineNext ? "다음 장은 내 차례 ▸ " : "다음 ▸ "),
       el("b", "", `${i + 2} / ${COUNT} ${nx.title}`), document.createTextNode(" — "),
       nameTag(nx.lines[0].who), document.createTextNode(`: ${nx.lines[0].say}`)]
    : [el("b", "", "마지막 장입니다")]));
  $("aim").textContent = fmt(targetSeconds(s));
  $("count").textContent = `${i + 1} / ${COUNT}`;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", String(j === i)));
  $("prev").disabled = i === 0 || $("lock").checked;
  $("nextBtn").disabled = i === COUNT - 1 || $("lock").checked;
  for (const id of ["start", "reset"]) $(id).disabled = $("lock").checked;
  $("start").textContent = state.startedAt === null ? "타이머 시작" : "타이머 도는 중";
  tick();
}

function tick() {
  const now = Date.now();
  const total = state.startedAt === null ? 0 : (now - state.startedAt) / 1000;
  const t = $("total");
  t.textContent = fmt(total);
  t.className = total > TALK.limit ? "bad" : total > TALK.limit - 30 ? "warn" : "";
  const spent = (now - enteredAt) / 1000;
  const h = $("here");
  h.textContent = fmt(spent);
  h.className = spent > targetSeconds(TALK.slides[here()]) ? "bad" : "";
}

function renderNet() {
  const n = $("net");
  n.className = "net " + (net === "on" ? "on" : net === "off" ? "off" : "");
  n.textContent = net === "on" ? `● 연결 · ${peers}대` : net === "off" ? "○ 끊김 — 이 기기만 넘어감" : "○ 연결 중…";
  $("share").title = `방 ${ROOM}`;
}

// ---------------------------------------------------------------- 상태 바꾸기
function apply(next) {
  if (next === state) return;
  if (here() !== Math.max(0, Math.min(COUNT - 1, next.slide))) enteredAt = Date.now();
  state = next;
  render();
}

function send() {
  if (channel && net === "on") {
    channel.send({ type: "broadcast", event: "state", payload: toWire(state, Date.now()) });
  }
}

function act(next) {
  if (next === state) return;
  apply(next);
  send();
}

function go(delta) {
  if (!$("lock").checked) act(step(state, delta, COUNT, ME_ID));
}

// ---------------------------------------------------------------- 동기화
async function connect() {
  let createClient;
  try {
    ({ createClient } = await import(SUPABASE_JS));
  } catch {
    net = "off"; renderNet(); return;          // 중계를 못 불러와도 이 기기만으로 끝까지 발표할 수 있다
  }
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  channel = sb.channel("presenter:" + ROOM, { config: { broadcast: { self: false }, presence: { key: ME_ID } } });
  channel
    .on("broadcast", { event: "state" }, ({ payload }) => apply(receive(state, payload, Date.now())))
    .on("broadcast", { event: "hello" }, () => { if (state.seq > 0) send(); })
    .on("presence", { event: "sync" }, () => { peers = Object.keys(channel.presenceState()).length; renderNet(); })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        net = "on"; renderNet();
        await channel.track({ at: Date.now() });
        channel.send({ type: "broadcast", event: "hello", payload: {} });   // 늦게 들어왔으면 지금 상태를 받는다
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        net = "off"; renderNet();
      }
    });
}

// ---------------------------------------------------------------- 탭 · 전체화면 · 조작
function showTab(name) {
  const slides = name !== "script";
  $("tab-slides").setAttribute("aria-selected", String(slides));
  $("tab-script").setAttribute("aria-selected", String(!slides));
  $("slides").hidden = !slides;
  $("script").hidden = slides;
  store.set("tab", slides ? "slides" : "script");
  fit();
}
const toggleTab = () => showTab($("slides").hidden ? "slides" : "script");

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("full", Boolean(document.fullscreenElement));
  fit();
});

function fit() {
  const box = $("slides");
  const k = Math.min(box.clientWidth / 1920, box.clientHeight / 1080) || 0;
  $("stage").style.transform = `translate(-50%, -50%) scale(${k})`;
}
new ResizeObserver(fit).observe($("slides"));

function setFont(f) {
  const v = Math.min(1.8, Math.max(0.6, Math.round(f * 10) / 10));
  document.documentElement.style.setProperty("--fs", v);
  store.set("fs", v);
}

addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest?.("select, input, textarea, [contenteditable]")) return;
  // 한글 자판이어도 같은 자리를 누르면 되게 key 가 아니라 code 로 본다. 클리커는 PageDown/PageUp 을 보낸다.
  const c = e.code;
  if (c === "ArrowRight" || c === "PageDown" || c === "Space") { e.preventDefault(); go(1); }
  else if (c === "ArrowLeft" || c === "PageUp") { e.preventDefault(); go(-1); }
  else if (c === "KeyF") { e.preventDefault(); toggleFull(); }
  else if (c === "KeyT") { e.preventDefault(); toggleTab(); }
});

const click = (id, fn) => $(id).addEventListener("click", (e) => { e.currentTarget.blur(); fn(); });
click("tab-slides", () => showTab("slides"));
click("tab-script", () => showTab("script"));
click("prev", () => go(-1));
click("nextBtn", () => go(1));
click("full", toggleFull);
click("start", () => act(setTimer(state, Date.now(), ME_ID)));
click("reset", () => act(setTimer(state, null, ME_ID)));
click("smaller", () => setFont(Number(getComputedStyle(document.documentElement).getPropertyValue("--fs")) - 0.1));
click("bigger", () => setFont(Number(getComputedStyle(document.documentElement).getPropertyValue("--fs")) + 0.1));
click("share", async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    toast(`복사됨 — 팀원에게 보내세요: ${location.href}`);
  } catch {
    toast(`이 주소를 팀원에게 보내세요: ${location.href}`);
  }
});

let toastTimer = 0;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

for (const name of TALK.people) {
  $("me").append(new Option(name, name));
  $("legend").append(nameTag(name, ""));
}
$("me").value = store.get("me", "");
$("me").addEventListener("change", () => { store.set("me", $("me").value); render(); });
$("lock").checked = store.get("lock", "0") === "1";
$("lock").addEventListener("change", () => { store.set("lock", $("lock").checked ? "1" : "0"); render(); });
$("limit").textContent = fmt(TALK.limit);
TALK.slides.forEach((s, j) => {
  const d = document.createElement("button");
  d.type = "button";
  d.title = `${j + 1}. ${s.title}`;
  d.setAttribute("aria-label", `${j + 1}장 ${s.title}`);
  d.addEventListener("click", (e) => { e.currentTarget.blur(); go(j - here()); });
  $("dots").append(d);
});

setFont(Number(store.get("fs", "1")) || 1);
showTab(store.get("tab", "slides"));
render();
renderNet();
setInterval(tick, 250);
connect();
</script>
</body>
</html>
