<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CADLens 발표 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 밝은 화면. 구글 미트로 공유해도 확대 없이 읽히게 슬라이드 글자는 1920 기준 32px 이상으로 둔다 */
  :root {
    --page: #e9eef5; --panel: #ffffff; --line: #d6dde8; --sub: #f6f8fb;
    --ink: #0f172a; --ink-2: #334155; --muted: #5b6678;
    --accent: #2a78d6; --accent-ink: #1d5fb5; --soft: #e8f1fc;
    --gray-mark: #898781;                       /* 강조형 그래프의 나머지 막대 */
    --mine-bg: #fff1b8; --mine-bar: #f2b200;
    --ok: #13803a; --warn: #b45309; --bad: #c62828;
    --fs: 1;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page); color: var(--ink); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; word-break: keep-all;
  }
  button, select { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 위 띠 */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs [role="tab"] { padding: 6px 16px; font-weight: 700; }
  .tabs [aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .net { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  .net.on { color: var(--ok); border-color: #b7e0c4; background: #f0faf3; }
  .net.off { color: var(--warn); border-color: #f3d2a8; background: #fff8ee; }
  .spacer { flex: 1; }
  .bar label { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .bar input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  main { position: relative; min-height: 0; }
  [role="tabpanel"] { position: absolute; inset: 0; }
  [role="tabpanel"][hidden] { display: none; }

  /* 슬라이드 — 1920×1080 을 화면에 맞춰 줄인다. 왼쪽 파란 띠가 눈길을 잡는다 */
  #slides { background: var(--page); }
  .stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center; background: #fff; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding: 196px 150px 140px 170px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, .12);
  }
  .stage::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: var(--accent); z-index: 1; }
  .kicker { font-size: 46px; font-weight: 800; color: var(--accent-ink); letter-spacing: -.5px; margin-bottom: 34px; }
  /* 장마다 제목 자리를 고정한다 — 넘길 때 눈이 제목을 다시 찾지 않게. 내용은 그 아래 가운데 */
  .stage > .kicker { position: absolute; left: 170px; right: 150px; top: 88px; margin: 0; }
  .kind-cover { padding-top: 104px; }
  .headline { font-size: 146px; font-weight: 850; line-height: 1.1; letter-spacing: -4px; }
  .sub { margin-top: 44px; font-size: 52px; font-weight: 650; color: var(--ink-2); line-height: 1.3; }
  .chip {
    display: inline-block; margin-top: 30px; padding: 12px 24px; border-radius: 14px;
    background: var(--soft); color: var(--accent-ink); font-size: 40px; font-weight: 750; align-self: flex-start;
  }
  .cover { display: grid; grid-template-columns: 1fr 600px; gap: 64px; align-items: center; }
  .cover img { display: block; width: 600px; border-radius: 26px; box-shadow: 0 22px 50px rgba(15, 23, 42, .28); }
  .cover figcaption { margin-top: 16px; font-size: 34px; font-weight: 650; color: var(--ink-2); text-align: center; }
  .byline { margin-top: 30px; font-size: 32px; font-weight: 650; color: var(--muted); }
  .value { font-size: 188px; font-weight: 850; letter-spacing: -5px; line-height: 1; white-space: nowrap; }
  .caption { margin-top: 50px; font-size: 54px; font-weight: 700; line-height: 1.3; }
  .note { margin-top: 24px; font-size: 40px; font-weight: 550; color: var(--ink-2); line-height: 1.35; }
  .arrow { color: var(--accent); font-weight: 800; }
  .value .after { color: var(--accent); }        /* 화살표 뒤 '지금' 숫자가 먼저 눈에 들어오게 */
  /* 요점 목록이 붙은 숫자 장 */
  .with-points .value { font-size: 150px; }
  .points { list-style: none; margin-top: 38px; display: grid; gap: 12px; }
  .points li { position: relative; padding-left: 46px; font-size: 42px; font-weight: 650; line-height: 1.3; }
  .points li::before { content: ""; position: absolute; left: 8px; top: .42em; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }
  .with-points .caption { margin-top: 34px; font-size: 46px; }
  /* 그래프가 붙은 숫자 장 */
  .with-chart .value { font-size: 128px; letter-spacing: -3px; }
  .chart { margin-top: 40px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .with-chart .note { margin-top: 18px; font-size: 38px; }
  .c-title { font-size: 34px; font-weight: 700; fill: var(--muted); }
  .c-label { font-size: 38px; font-weight: 650; fill: var(--ink-2); }
  .c-label.c-focus { fill: var(--ink); font-weight: 850; }
  .c-value { font-size: 38px; }
  .c-num { font-weight: 850; fill: var(--ink); }
  .c-note { font-weight: 600; fill: var(--ink-2); }
  .c-in { font-size: 42px; font-weight: 800; fill: #fff; }
  .c-out { font-size: 42px; font-weight: 850; fill: var(--ink); }
  .c-axis { font-size: 36px; font-weight: 650; fill: var(--ink-2); }
  .c-target { font-size: 36px; font-weight: 800; fill: var(--ink); }
  /* W4 → 지금 표 */
  .cmp { width: 100%; border-collapse: collapse; }
  .cmp th { text-align: left; font-size: 34px; color: var(--muted); font-weight: 750; padding: 0 22px 16px; border-bottom: 3px solid var(--ink); }
  .cmp td { padding: 18px 22px; border-bottom: 1px solid var(--line); font-size: 42px; vertical-align: baseline; line-height: 1.25; }
  .cmp td:first-child { width: 31%; color: var(--ink-2); font-size: 36px; font-weight: 650; }
  .cmp td:nth-child(2) { width: 19%; color: var(--muted); }
  .cmp td:nth-child(3) { font-weight: 800; }
  .cmp-note { margin-top: 18px; font-size: 32px; color: var(--muted); }
  /* 시연 영상 — 슬라이드 전체. 자막이 영상 안에 있어 제목과 아래 글은 얹지 않는다 */
  .kind-video { padding: 0; background: #eef3f9; }
  .kind-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .kind-video .foot { display: none; }
  /* 런칭 주 흐름 */
  .steps { display: flex; align-items: flex-start; gap: 24px; }          /* 이름표가 두 줄이어도 숫자 높이는 맞춘다 */
  .step { flex: 1 1 0; min-width: 0; text-align: center; }
  .step b { display: block; font-size: 188px; font-weight: 850; line-height: 1; letter-spacing: -4px; }
  .step span { display: block; margin-top: 18px; font-size: 44px; color: var(--ink-2); font-weight: 650; }
  .steps .arrow { font-size: 110px; line-height: 188px; }
  /* 질문 */
  .question { font-size: 116px; font-weight: 850; line-height: 1.18; letter-spacing: -2px; }
  .kind-ask .sub { font-size: 48px; }
  .foot {
    position: absolute; left: 170px; right: 150px; bottom: 52px;
    display: flex; justify-content: space-between; font-size: 30px; color: var(--muted); font-weight: 600;
  }

  /* 대본 */
  #script { display: grid; grid-template-rows: auto 1fr auto; background: var(--panel); }
  #script[hidden] { display: none; }
  .script-top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--sub);
  }
  .where { font-size: 26px; font-weight: 800; }
  .where small { color: var(--muted); font-weight: 650; margin-right: 10px; }
  .turn { margin-left: 12px; font-size: 18px; font-weight: 700; color: var(--ink-2); }
  .turn .me-too { margin-left: 6px; padding: 2px 8px; border-radius: 6px; background: var(--mine-bg); color: #6b4e00; }
  .clock { font-size: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .clock b { color: var(--ink); font-size: 30px; }
  .clock .warn { color: var(--warn); }
  .clock .bad { color: var(--bad); }
  .lines { list-style: none; overflow-y: auto; padding: 22px 28px 40px; }
  /* 읽는 사람마다 다른 색(--who), 내 줄은 노란 형광펜 */
  .line {
    display: grid; grid-template-columns: 4.4em 1fr; gap: 0 18px; align-items: baseline;
    padding: .38em 14px; border-left: 6px solid transparent; border-radius: 10px;
    font-size: calc(var(--fs) * clamp(24px, 2.6vw, 46px)); line-height: 1.45;
  }
  .who {
    font-size: .52em; font-weight: 800; text-align: right; justify-self: end;
    padding: .2em .55em; border-radius: 6px;
    color: var(--who); background: color-mix(in srgb, var(--who) 12%, white);
  }
  .say { font-weight: 650; }
  .line.dim { color: #64748b; }
  .line.dim .say { font-weight: 500; }
  .line.dim .who { background: transparent; }
  .line.mine { background: var(--mine-bg); border-left-color: var(--mine-bar); }
  .line.mine .say { font-weight: 800; }
  .line.mine .who { background: var(--who); color: #fff; }
  .legend { display: flex; gap: 10px; font-size: 15px; font-weight: 800; }
  .legend span { color: var(--who); }
  .name { color: var(--who); font-weight: 800; }
  .next {
    padding: 14px 24px; border-top: 1px solid var(--line); color: var(--ink-2); background: var(--sub);
    font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .next b { color: var(--ink); }
  .next.mine { background: var(--mine-bg); color: #6b4e00; }
  .next.mine b { color: #4a3600; }

  /* 아래 띠 */
  .nav {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-top: 1px solid var(--line); font-size: 14px; color: var(--muted);
  }
  .dots { display: flex; gap: 6px; }
  .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; }
  .dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
  .count { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }
  .keys { margin-left: auto; }

  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 5;
    background: var(--ink); color: #fff; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; max-width: calc(100vw - 32px); overflow-wrap: anywhere;
  }

  /* 전체화면 — 브라우저 전체화면이 아니라 이 사이트 안에서 띠를 숨기고 슬라이드를 꽉 채운다 */
  body.full { grid-template-rows: 1fr; }          /* 띠가 빠지면 가운데 칸 하나만 남는다 */
  body.full .bar, body.full .nav { display: none; }
  body.full #slides { background: #fff; }
  body.full .stage { box-shadow: none; }

  @media (max-width: 720px) {
    .keys { display: none; }
    .line { grid-template-columns: 1fr; }
    .who { justify-self: start; margin-bottom: .2em; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .line { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="tabs" role="tablist" aria-label="화면">
    <button role="tab" id="tab-slides" aria-controls="slides" aria-selected="true">슬라이드</button>
    <button role="tab" id="tab-script" aria-controls="script" aria-selected="false">대본</button>
  </div>
  <span class="net" id="net" role="status">○ 연결 중…</span>
  <span class="spacer"></span>
  <label>나 <select id="me" aria-label="내 이름"><option value="">고르지 않음</option></select></label>
  <label title="켜면 이 기기에서는 넘기지 않고 다른 기기만 따라갑니다"><input type="checkbox" id="lock"> 따라가기만</label>
  <button id="share" type="button">방 주소 복사</button>
  <button id="full" type="button" title="F">⛶ 전체화면</button>
</header>

<main>
  <section id="slides" role="tabpanel" aria-labelledby="tab-slides">
    <div class="stage" id="stage"></div>
  </section>
  <section id="script" role="tabpanel" aria-labelledby="tab-script" hidden>
    <div class="script-top">
      <div class="where" id="where"></div>
      <div class="clock">전체 <b id="total">0:00</b> / <span id="limit"></span>
        · 이 장 <b id="here">0:00</b> / <span id="aim"></span></div>
      <div class="legend" id="legend" aria-label="읽는 사람 색"></div>
      <span class="spacer"></span>
      <button id="start" type="button">타이머 시작</button>
      <button id="reset" type="button">다시</button>
      <button id="smaller" type="button" aria-label="글자 작게">가−</button>
      <button id="bigger" type="button" aria-label="글자 크게">가+</button>
    </div>
    <ol class="lines" id="lines"></ol>
    <div class="next" id="next"></div>
  </section>
</main>

<footer class="nav">
  <button id="prev" type="button">◀ 이전</button>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
  <button id="nextBtn" type="button">다음 ▶</button>
  <span class="keys">→ · Space 다음 · ← 이전 · F 전체화면(Esc 로 나옴) · T 탭</span>
</footer>
<div class="toast" id="toast" hidden></div>
<noscript>자바스크립트를 켜야 발표 도우미가 뜹니다.</noscript>

<script type="module">
import { initial, step, setTimer, toWire, receive } from "./state.js";
import { TALK, VOICE, targetSeconds } from "./talk.js";

// 기기 사이 중계 — Supabase 실시간 채널. 이 키는 브라우저에 두라고 만든 공개용 키이고 테이블은 쓰지 않는다.
const SUPABASE_URL = "https://hgmshnoaipajahvmzcqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_dSIb5HLyDunrFEprXL00DA_kCIJml3E";
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const $ = (id) => document.getElementById(id);
const COUNT = TALK.slides.length;

// 시연 영상 — 한 요소를 처음부터 받아 두고 계속 쓴다. 그 장에 오자마자 끊김 없이 돈다. 누르면 처음부터 다시.
// 소리(팀원 목소리)는 전체화면(F)인 기기에서만 — Meet 로 공유하는 노트북 하나. 대본을 보는 기기들까지 소리를 내면
// 한 방에서 겹치고 마이크로 다시 들어간다.
const VIDEO = Object.assign(document.createElement("video"), { muted: true, playsInline: true, preload: "auto" });
function playVideo() {
  VIDEO.currentTime = 0;
  VIDEO.muted = !document.body.classList.contains("full");
  VIDEO.play().catch(() => {            // 이 탭에서 아직 아무것도 안 눌러 소리 재생이 막혔으면 소리 없이라도 돈다
    VIDEO.muted = true;
    VIDEO.play().catch(() => {});
    toast("소리가 막혔습니다 — 영상을 한 번 누르면 소리와 함께 처음부터");
  });
}
VIDEO.addEventListener("click", playVideo);
const firstVideo = TALK.slides.find((s) => s.view.kind === "video");
if (firstVideo) VIDEO.src = firstVideo.view.src;
const ME_ID = crypto.getRandomValues(new Uint32Array(2)).join("").slice(0, 12);   // 이 기기(탭) — 동률 판정용

const store = {
  get(k, d) { try { return localStorage.getItem("presenter." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("presenter." + k, v); } catch { /* 저장이 막혀도 화면은 돈다 */ } },
};

// 방 — 주소 뒤 #코드. 코드를 아는 기기끼리만 같이 넘어간다.
function roomCode() {
  const code = location.hash.slice(1).toLowerCase();
  if (/^[a-z0-9]{4,16}$/.test(code)) return code;
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  const made = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => abc[b % abc.length]).join("");
  history.replaceState(null, "", "#" + made);
  return made;
}
const ROOM = roomCode();
addEventListener("hashchange", () => location.reload());

let state = initial(ME_ID);
let enteredAt = Date.now();          // 이 장에 들어온 때 (기기마다)
let channel = null, net = "wait", peers = 0;

// ---------------------------------------------------------------- 그리기
const fmt = (sec) => { const s = Math.max(0, Math.floor(sec)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.append(...withBreaks(text));
  return e;
}
function arrow() {
  const a = document.createElement("span");
  a.className = "arrow";
  a.textContent = "→";
  return a;
}
// "\n" 은 줄바꿈, "→" 는 강조색으로
function withBreaks(text) {
  const out = [];
  String(text).split("\n").forEach((part, i) => {
    if (i) out.push(document.createElement("br"));
    part.split("→").forEach((bit, j) => {
      if (j) out.push(arrow());
      if (bit) out.push(document.createTextNode(bit));
    });
  });
  return out;
}

// ---------------------------------------------------------------- 그래프 (SVG)
// 하나를 강조하고 나머지는 회색(강조형). 글자는 데이터 색을 입히지 않고 글자색으로만 쓴다.
// 막대는 값 쪽 끝만 둥글게, 기준선 쪽은 각지게. 단위는 슬라이드 본문 폭(1600)과 같다.
const SVGNS = "http://www.w3.org/2000/svg";
const CW = 1600;
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
const num = (n) => n.toLocaleString("ko-KR");
const markFill = (focus) => (focus ? "var(--accent)" : "var(--gray-mark)");
// 오른쪽 끝만 둥근 가로 막대
const hbarPath = (x, y, w, h, r) => {
  r = Math.min(r, w / 2, h / 2);
  return `M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${r - w}z`;
};
// 위쪽만 둥근 세로 막대 (y 는 위 끝)
const colPath = (x, y, w, h, r) => {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}v${r - h}a${r},${r} 0 0 1 ${r},${-r}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - r}z`;
};
function chartSvg(h, label) {
  return svgEl("svg", { viewBox: `0 0 ${CW} ${h}`, role: "img", "aria-label": label });
}
const CHART = {
  hbar(c) {
    const top = 66, rowH = 84, barH = 46, labelW = 380, maxBar = 720;
    const max = Math.max(...c.rows.map((r) => r.value));
    const svg = chartSvg(top + c.rows.length * rowH,
      `${c.title}: ${c.rows.map((r) => `${r.label} ${r.value}${c.unit}`).join(", ")}`);
    svg.append(svgEl("text", { x: 0, y: 34, class: "c-title" }, c.title));
    c.rows.forEach((r, i) => {
      const cy = top + i * rowH + rowH / 2, w = Math.max(8, (r.value / max) * maxBar);
      svg.append(svgEl("text", { x: labelW - 26, y: cy, "text-anchor": "end", "dominant-baseline": "central",
                                 class: "c-label" + (r.focus ? " c-focus" : "") }, r.label));
      const bar = svgEl("path", { d: hbarPath(labelW, cy - barH / 2, w, barH, 8), fill: markFill(r.focus) });
      bar.append(svgEl("title", {}, `${r.label} ${r.value}${c.unit}`));
      svg.append(bar);
      const t = svgEl("text", { x: labelW + w + 20, y: cy, "dominant-baseline": "central", class: "c-value" });
      t.append(svgEl("tspan", { class: "c-num" }, `${r.value}${c.unit}`));
      if (r.note) t.append(svgEl("tspan", { class: "c-note", dx: 18 }, r.note));
      svg.append(t);
    });
    return svg;
  },
  stack(c) {
    const total = c.parts.reduce((n, p) => n + p.value, 0);
    const top = 70, barH = 96, gap = 6, r = 10;
    const svg = chartSvg(top + barH + 78,
      `${c.label} ${num(total)}${c.unit}: ${c.parts.map((p) => `${p.label} ${num(p.value)}${c.unit}`).join(", ")}`);
    svg.append(svgEl("text", { x: 0, y: 36, class: "c-title" }, `${c.label} ${num(total)}${c.unit}`));
    const usable = CW - gap * (c.parts.length - 1);
    let x = 0;
    c.parts.forEach((p, i) => {
      const w = Math.max(14, (p.value / total) * usable);
      const first = i === 0, last = i === c.parts.length - 1;
      // 바깥 끝만 둥글게 — 조각 사이는 6px 틈으로 가른다
      const d = `M${x + (first ? r : 0)},${top}h${w - (first ? r : 0) - (last ? r : 0)}`
        + (last ? `a${r},${r} 0 0 1 ${r},${r}v${barH - 2 * r}a${r},${r} 0 0 1 ${-r},${r}` : `v${barH}`)
        + `h${-(w - (first ? r : 0) - (last ? r : 0))}`
        + (first ? `a${r},${r} 0 0 1 ${-r},${-r}v${2 * r - barH}a${r},${r} 0 0 1 ${r},${-r}z` : `v${-barH}z`);
      const seg = svgEl("path", { d, fill: markFill(p.focus) });
      seg.append(svgEl("title", {}, `${p.label} ${num(p.value)}${c.unit}`));
      svg.append(seg);
      const text = `${p.label} ${num(p.value)}${c.unit}`;
      if (w > 560) {                                // 글자가 넉넉히 들어갈 때만 막대 안에
        svg.append(svgEl("text", { x: x + 34, y: top + barH / 2, "dominant-baseline": "central", class: "c-in" }, text));
      } else {                                      // 아니면 막대 아래, 그 조각 끝에 맞춰
        svg.append(svgEl("text", { x: x + w, y: top + barH + 56, "text-anchor": "end", class: "c-out" }, text));
      }
      x += w + gap;
    });
    return svg;
  },
  column(c) {
    const top = 120, plotH = 300, base = top + plotH, left = 30, right = 300;
    const max = Math.max(c.target ? c.target.value : 0, ...c.cols.map((k) => k.value));
    const y = (v) => base - (v / max) * plotH;
    const slot = (CW - left - right) / c.cols.length, colW = Math.min(118, slot * 0.5);
    const svg = chartSvg(base + 72,
      `${c.title}: ${c.cols.map((k) => `${k.label} ${k.value}${c.unit}`).join(", ")}${c.target ? `, ${c.target.label}` : ""}`);
    svg.append(svgEl("text", { x: 0, y: 30, class: "c-title" }, c.title));
    svg.append(svgEl("line", { x1: 0, x2: CW - 10, y1: base, y2: base, stroke: "var(--line)", "stroke-width": 3 }));   // 목표선과 같은 길이
    if (c.target) {
      const ty = y(c.target.value);
      svg.append(svgEl("line", { x1: 0, x2: CW - 10, y1: ty, y2: ty, stroke: "var(--ink)", "stroke-width": 3 }));
      svg.append(svgEl("text", { x: CW - 10, y: ty - 16, "text-anchor": "end", class: "c-target" }, c.target.label));
    }
    c.cols.forEach((k, i) => {
      const x = left + i * slot + (slot - colW) / 2, h = base - y(k.value);
      if (h > 0) {
        const col = svgEl("path", { d: colPath(x, y(k.value), colW, h, 8), fill: markFill(k.focus) });
        col.append(svgEl("title", {}, `${k.label} ${k.value}${c.unit}`));
        svg.append(col);
      }
      svg.append(svgEl("text", { x: x + colW / 2, y: y(k.value) - 16, "text-anchor": "middle",
                                 class: "c-num", "font-size": 40 }, `${k.value}${c.unit}`));
      svg.append(svgEl("text", { x: x + colW / 2, y: base + 50, "text-anchor": "middle", class: "c-axis" }, k.label));
    });
    return svg;
  },
};
function chartBox(c) {
  const box = el("div", "chart");
  box.append(CHART[c.type](c));
  return box;
}

function valueEl(text) {
  const d = el("div", "value", text);
  const last = d.lastChild;
  if (String(text).includes("→") && last?.nodeType === Node.TEXT_NODE) last.replaceWith(el("span", "after", last.textContent));
  return d;
}

const VIEWS = {
  cover: (v) => {
    const text = el("div");
    text.append(el("div", "kicker", v.kicker), el("div", "headline", v.headline), el("div", "sub", v.sub),
                ...(v.note ? [el("div", "chip", v.note)] : []), ...(v.by ? [el("div", "byline", v.by)] : []));
    if (!v.img) return [text];
    const fig = el("figure");
    const img = document.createElement("img");
    img.src = v.img;
    img.alt = v.imgAlt || "";
    fig.append(img, el("figcaption", "", "실제 화면 — 고칠 자리를 도면 위에"));
    const wrap = el("div", "cover");
    wrap.append(text, fig);
    return [wrap];
  },
  compare: (v) => {
    const table = el("table", "cmp");
    const head = el("tr");
    v.head.forEach((h) => head.append(el("th", "", h)));
    table.append(head);
    v.rows.forEach((row) => {
      const tr = el("tr");
      row.forEach((cell) => tr.append(el("td", "", cell)));
      table.append(tr);
    });
    return [el("div", "kicker", v.kicker), table, v.note ? el("div", "cmp-note", v.note) : ""];
  },
  big: (v) => {
    const points = v.points ? el("ul", "points") : "";
    (v.points || []).forEach((p) => points.append(el("li", "", p)));
    return [el("div", "kicker", v.kicker), valueEl(v.value), points,
            v.chart ? chartBox(v.chart) : "", v.caption ? el("div", "caption", v.caption) : "",
            v.note ? el("div", "note", v.note) : ""];
  },
  video: (v) => {
    if (!VIDEO.src.endsWith(v.src)) VIDEO.src = v.src;
    VIDEO.poster = v.poster || "";
    VIDEO.setAttribute("aria-label", v.label || "시연 영상");
    playVideo();
    return [VIDEO];
  },
  flow: (v) => {
    const row = el("div", "steps");
    v.steps.forEach((s, i) => {
      if (i) row.append(arrow());
      const box = el("div", "step");
      box.append(el("b", "", s.n), el("span", "", s.label));
      row.append(box);
    });
    return [el("div", "kicker", v.kicker), row, el("div", "caption", v.caption)];
  },
  ask: (v) => [el("div", "kicker", v.kicker), el("div", "question", v.question), el("div", "sub", v.sub),
               v.note ? el("div", "chip", v.note) : ""],
};

const here = () => Math.max(0, Math.min(COUNT - 1, state.slide));

// 읽는 사람마다 색 — people 순서대로 붙는다. 노랑은 "내 줄" 강조에 남겨 둔다
const PALETTE = ["#1d5fb5", "#127a45", "#b02a68", "#5b3fc4"];   // 흰 바탕에서 4.5:1 이상
const colorOf = (who) => (who === VOICE ? "#64748b" : PALETTE[Math.max(0, TALK.people.indexOf(who)) % PALETTE.length]);
function nameTag(who, cls = "name") {
  const n = el("span", cls, who);
  n.style.setProperty("--who", colorOf(who));
  return n;
}

function render() {
  const i = here(), s = TALK.slides[i];
  const stage = $("stage");
  if (stage.dataset.slide !== String(i)) {     // 같은 장이면 다시 그리지 않는다 — 타이머·이름을 바꿔도 영상이 처음으로 안 돌아간다
    stage.dataset.slide = i;
    if (s.view.kind !== "video") VIDEO.pause();
    stage.className = `stage kind-${s.view.kind}${s.view.points ? " with-points" : ""}${s.view.chart ? " with-chart" : ""}`;
    stage.replaceChildren(...VIEWS[s.view.kind](s.view).filter(Boolean));
    const foot = el("div", "foot");
    foot.append(el("span", "", "CADLens · 팀 네이놈" + (s.source ? ` · 출처 ${s.source}` : "")), el("span", "", `${i + 1} / ${COUNT}`));
    stage.append(foot);
  }

  const me = $("me").value;
  const who = [...new Set(s.lines.map((l) => l.who))];
  const turn = el("span", "turn");
  who.forEach((w, j) => turn.append(...(j ? [document.createTextNode(" · ")] : []), nameTag(w)));
  turn.append(document.createTextNode(" 차례"));
  if (who.includes(me)) turn.append(el("span", "me-too", " — 내 차례"));
  $("where").replaceChildren(el("small", "", `${i + 1} / ${COUNT}`), document.createTextNode(s.title), turn);
  $("lines").replaceChildren(...s.lines.map((l) => {
    const li = el("li", "line" + (me && l.who === me ? " mine" : me ? " dim" : ""));
    li.style.setProperty("--who", colorOf(l.who));
    li.append(el("span", "who", l.who), el("span", "say", l.say));
    return li;
  }));
  $("lines").scrollTop = 0;
  // 여럿이 나눠 읽으니, 다음 장이 내 차례면 미리 알려 준다
  const nx = TALK.slides[i + 1];
  const mineNext = Boolean(me && nx && nx.lines.some((l) => l.who === me));
  $("next").className = "next" + (mineNext ? " mine" : "");
  $("next").replaceChildren(...(nx
    ? [document.createTextNode(mineNext ? "다음 장은 내 차례 ▸ " : "다음 ▸ "),
       el("b", "", `${i + 2} / ${COUNT} ${nx.title}`), document.createTextNode(" — "),
       nameTag(nx.lines[0].who), document.createTextNode(`: ${nx.lines[0].say}`)]
    : [el("b", "", "마지막 장입니다")]));
  $("aim").textContent = fmt(targetSeconds(s));
  $("count").textContent = `${i + 1} / ${COUNT}`;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", String(j === i)));
  $("prev").disabled = i === 0 || $("lock").checked;
  $("nextBtn").disabled = i === COUNT - 1 || $("lock").checked;
  for (const id of ["start", "reset"]) $(id).disabled = $("lock").checked;
  $("start").textContent = state.startedAt === null ? "타이머 시작" : "타이머 도는 중";
  tick();
}

function tick() {
  const now = Date.now();
  const total = state.startedAt === null ? 0 : (now - state.startedAt) / 1000;
  const t = $("total");
  t.textContent = fmt(total);
  t.className = total > TALK.limit ? "bad" : total > TALK.limit - 30 ? "warn" : "";
  const spent = (now - enteredAt) / 1000;
  const h = $("here");
  h.textContent = fmt(spent);
  h.className = spent > targetSeconds(TALK.slides[here()]) ? "bad" : "";
}

function renderNet() {
  const n = $("net");
  n.className = "net " + (net === "on" ? "on" : net === "off" ? "off" : "");
  n.textContent = net === "on" ? `● 연결 · ${peers}대` : net === "off" ? "○ 끊김 — 이 기기만 넘어감" : "○ 연결 중…";
  $("share").title = `방 ${ROOM}`;
}

// ---------------------------------------------------------------- 상태 바꾸기
function apply(next) {
  if (next === state) return;
  if (here() !== Math.max(0, Math.min(COUNT - 1, next.slide))) enteredAt = Date.now();
  state = next;
  render();
}

function send() {
  if (channel && net === "on") {
    channel.send({ type: "broadcast", event: "state", payload: toWire(state, Date.now()) });
  }
}

function act(next) {
  if (next === state) return;
  apply(next);
  send();
}

function go(delta) {
  if (!$("lock").checked) act(step(state, delta, COUNT, ME_ID));
}

// ---------------------------------------------------------------- 동기화
async function connect() {
  let createClient;
  try {
    ({ createClient } = await import(SUPABASE_JS));
  } catch {
    net = "off"; renderNet(); return;          // 중계를 못 불러와도 이 기기만으로 끝까지 발표할 수 있다
  }
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  channel = sb.channel("presenter:" + ROOM, { config: { broadcast: { self: false }, presence: { key: ME_ID } } });
  channel
    .on("broadcast", { event: "state" }, ({ payload }) => apply(receive(state, payload, Date.now())))
    .on("broadcast", { event: "hello" }, () => { if (state.seq > 0) send(); })
    .on("presence", { event: "sync" }, () => { peers = Object.keys(channel.presenceState()).length; renderNet(); })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        net = "on"; renderNet();
        await channel.track({ at: Date.now() });
        channel.send({ type: "broadcast", event: "hello", payload: {} });   // 늦게 들어왔으면 지금 상태를 받는다
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        net = "off"; renderNet();
      }
    });
}

// ---------------------------------------------------------------- 탭 · 전체화면 · 조작
function showTab(name) {
  const slides = name !== "script";
  $("tab-slides").setAttribute("aria-selected", String(slides));
  $("tab-script").setAttribute("aria-selected", String(!slides));
  $("slides").hidden = !slides;
  $("script").hidden = slides;
  store.set("tab", slides ? "slides" : "script");
  fit();
}
const toggleTab = () => showTab($("slides").hidden ? "slides" : "script");

// 전체화면 — 브라우저 전체화면이 아니라 이 사이트 안에서 위·아래 띠만 숨기고 지금 탭을 꽉 채운다.
// 미트로 이 탭을 공유하면 슬라이드만 보인다.
function toggleFull(on = !document.body.classList.contains("full")) {
  document.body.classList.toggle("full", on);
  VIDEO.muted = !on;                    // 영상 장에서 F 를 누르면 그때부터 소리
  fit();
  if (on) toast("F 또는 Esc 를 누르면 띠가 다시 나옵니다", 2500);
}

function fit() {
  const box = $("slides");
  const k = Math.min(box.clientWidth / 1920, box.clientHeight / 1080) || 0;
  $("stage").style.transform = `translate(-50%, -50%) scale(${k})`;
}
new ResizeObserver(fit).observe($("slides"));

function setFont(f) {
  const v = Math.min(1.8, Math.max(0.6, Math.round(f * 10) / 10));
  document.documentElement.style.setProperty("--fs", v);
  store.set("fs", v);
}

addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest?.("select, input, textarea, [contenteditable]")) return;
  // 한글 자판이어도 같은 자리를 누르면 되게 key 가 아니라 code 로 본다. 클리커는 PageDown/PageUp 을 보낸다.
  const c = e.code;
  if (c === "ArrowRight" || c === "PageDown" || c === "Space") { e.preventDefault(); go(1); }
  else if (c === "ArrowLeft" || c === "PageUp") { e.preventDefault(); go(-1); }
  else if (c === "KeyF") { e.preventDefault(); toggleFull(); }
  else if (c === "Escape" && document.body.classList.contains("full")) { e.preventDefault(); toggleFull(false); }
  else if (c === "KeyT") { e.preventDefault(); toggleTab(); }
});

const click = (id, fn) => $(id).addEventListener("click", (e) => { e.currentTarget.blur(); fn(); });
click("tab-slides", () => showTab("slides"));
click("tab-script", () => showTab("script"));
click("prev", () => go(-1));
click("nextBtn", () => go(1));
click("full", () => toggleFull(true));
click("start", () => act(setTimer(state, Date.now(), ME_ID)));
click("reset", () => act(setTimer(state, null, ME_ID)));
click("smaller", () => setFont(Number(getComputedStyle(document.documentElement).getPropertyValue("--fs")) - 0.1));
click("bigger", () => setFont(Number(getComputedStyle(document.documentElement).getPropertyValue("--fs")) + 0.1));
click("share", async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    toast(`복사됨 — 팀원에게 보내세요: ${location.href}`);
  } catch {
    toast(`이 주소를 팀원에게 보내세요: ${location.href}`);
  }
});

let toastTimer = 0;
function toast(text, ms = 6000) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

for (const name of TALK.people) {
  $("me").append(new Option(name, name));
  $("legend").append(nameTag(name, ""));
}
$("me").value = store.get("me", "");
$("me").addEventListener("change", () => { store.set("me", $("me").value); render(); });
$("lock").checked = store.get("lock", "0") === "1";
$("lock").addEventListener("change", () => { store.set("lock", $("lock").checked ? "1" : "0"); render(); });
$("limit").textContent = fmt(TALK.limit);
TALK.slides.forEach((s, j) => {
  const d = document.createElement("button");
  d.type = "button";
  d.title = `${j + 1}. ${s.title}`;
  d.setAttribute("aria-label", `${j + 1}장 ${s.title}`);
  d.addEventListener("click", (e) => { e.currentTarget.blur(); go(j - here()); });
  $("dots").append(d);
});

setFont(Number(store.get("fs", "1")) || 1);
showTab(store.get("tab", "slides"));
render();
renderNet();
setInterval(tick, 250);
connect();
</script>
</body>
</html>
